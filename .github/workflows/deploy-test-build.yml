name: Deploy test_build

on:
  push:
    branches:
      - test_build
  workflow_dispatch:

concurrency:
  group: deploy-test-build
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "VPS_HOST is empty"; exit 1; }
          [ -n "$VPS_USER" ] || { echo "VPS_USER is empty"; exit 1; }
          [ -n "$VPS_SSH_KEY_B64" ] || { echo "VPS_SSH_KEY_B64 is empty"; exit 1; }
          echo "Secrets are present"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "SSH files prepared"

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "echo SSH_OK && whoami"

      - name: Run deploy script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" "cd /root/vataga && ./deploy.sh"

      - name: Upgrade mrp_vataga after deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" "
            set -e
            cd /root/vataga

            trap 'docker compose up -d saas-odoo' EXIT

            docker compose stop saas-odoo
            docker compose run --rm --entrypoint bash saas-odoo -lc 'odoo -c /etc/odoo/odoo.conf -d odoo_community -u mrp_vataga --stop-after-init'
          "
